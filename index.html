<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Sales Management</title><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Sales Management"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;overflow-x:hidden}body{font-family:"Meiryo UI","メイリオ","Meiryo",-apple-system,BlinkMacSystemFont,sans-serif;background:linear-gradient(180deg,#e9fbff 0,#f7fbfd 260px,#f3f8fa 100%);color:#173047}.apphead{padding:17px 16px 15px;background:linear-gradient(135deg,#128eae,#377ee8);color:#fff;box-shadow:0 5px 18px rgba(26,119,157,.18)}.headrow{max-width:650px;margin:auto;display:flex;align-items:center;gap:11px}.logo{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-weight:900;font-size:17px;border:1px solid rgba(255,255,255,.28)}h1{font-size:20px;margin:0;letter-spacing:.035em}.sub{font-size:10px;opacity:.82;margin-top:2px}main{max-width:650px;margin:auto;padding:13px 12px 48px}.section{font-size:12px;font-weight:700;color:#347083;margin:18px 3px 8px}.goals{display:grid;grid-template-columns:1fr 1fr;gap:8px}.goal,.panel,.case,.empty,.filter{background:rgba(255,255,255,.96);border:1px solid #d9eef3;border-radius:15px;box-shadow:0 5px 18px rgba(30,116,143,.07)}.goal{padding:12px;min-width:0}.goalMetric{display:flex;align-items:center;gap:9px;margin-top:5px}.donut{--pct:0;width:48px;height:48px;flex:0 0 48px;border-radius:50%;background:conic-gradient(#18a5b8 calc(var(--pct)*1%),#e3f0f3 0);position:relative}.donut:after{content:"";position:absolute;inset:7px;background:#fff;border-radius:50%}.metricText{min-width:0;flex:1}.outreachIcon{width:34px;height:34px;color:#1698ad;display:block;margin:7px 0 2px}.outreachMain{display:flex;align-items:center;gap:8px}.outreachMain .outreachDone{margin-left:auto}.goal.action{grid-column:auto}.goal.outreach{display:flex;flex-direction:column;justify-content:space-between}.outreachCheck{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:11px;color:#557887}.outreachCheck input{width:22px;height:22px;accent-color:#1688a4}.outreachDone{font-size:15px;font-weight:900;color:#1688a4}.modeSwitch{display:flex;gap:3px;background:#eaf5f7;padding:3px;border-radius:9px;margin-left:8px}.modeSwitch button{border:0;background:transparent;color:#6b8792;font-family:inherit;font-size:10px;font-weight:700;padding:5px 8px;border-radius:7px}.modeSwitch button.active{background:#fff;color:#147d95;box-shadow:0 1px 5px rgba(30,100,120,.12)}.listTitleWrap{display:flex;align-items:center;min-width:0}.goalTop{display:flex;justify-content:space-between}.label{font-size:11px;color:#6c8995}.rate{font-size:18px;font-weight:900;color:#1688a4}.remain{font-size:11px;color:#557887;margin-top:6px}.remain b{font-size:14px;color:#254f61}.target{font-size:9px;color:#8aa0aa;margin-top:2px}.goalInput{width:58px;border:0;border-bottom:1px solid #cfe4e9;background:transparent;text-align:right;font-size:10px}.bar{height:7px;background:#e5f2f5;border-radius:99px;overflow:hidden;margin-top:8px}.fill{height:100%;background:linear-gradient(90deg,#24b4c2,#3985e6);border-radius:99px}.panel{padding:11px}.field{min-width:0;margin-bottom:8px}.field label{display:block;font-size:10px;color:#708995;margin:0 0 3px 2px}.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:7px}input,select,textarea{font-family:inherit;width:100%;min-width:0;border:1px solid #d6e8ed;border-radius:9px;padding:9px 8px;font-size:14px;background:#fbfeff;color:#173047}textarea{height:52px;resize:vertical}.certainty{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.certainty.edit{grid-template-columns:repeat(4,1fr)}.certainty input{display:none}.certainty label{display:block!important;text-align:center;margin:0!important;padding:8px;border:1px solid #d7e8ed;border-radius:9px;background:#f5fbfc;font-size:13px!important;color:#607b87!important}.certainty input:checked+label{background:linear-gradient(135deg,#def8f9,#e8f2ff);border-color:#50b9ce;color:#11758b!important;font-weight:800}.primary{width:100%;border:0;border-radius:10px;padding:11px;background:linear-gradient(135deg,#20a6c1,#3985e6);color:#fff;font-family:inherit;font-size:14px;font-weight:800}.filter{padding:8px;display:flex;align-items:center;gap:7px}.filter button{border:0;background:transparent;font-size:17px;color:#3985e6;padding:5px 9px}.filter input{display:none!important}.monthLabel{flex:1;text-align:center;font-size:14px;font-weight:800;color:#24576b;letter-spacing:.02em}.listHead{display:flex;justify-content:space-between;align-items:end;margin:18px 3px 8px}.listHead .section{margin:0}.count{font-size:10px;color:#7e98a3}.list{display:grid;gap:8px}.case{padding:12px;border-left:5px solid #27a9c5}.case.b{border-left-color:#78b8ca}.case.c{border-left-color:#b9d5dc}.case.won{border-left-color:#aeb8bd;background:#edf0f2;opacity:.66;box-shadow:none;filter:grayscale(.65)}.top{display:flex;justify-content:space-between;gap:8px}.name{font-size:15px;font-weight:900}.badge{font-size:10px;font-weight:800;background:#e5f8fb;color:#16798f;padding:4px 8px;border-radius:99px;white-space:nowrap;height:max-content}.won .badge{background:#d6dade;color:#68747a}.mainMeta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:7px}.kind{font-size:10px;font-weight:800;color:#28708a;background:#eef9fb;padding:3px 7px;border-radius:6px}.premium{font-size:14px;font-weight:900;color:#234d61}.subMeta{font-size:10px;color:#738d99;margin-top:6px;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}.memo{font-size:10px;color:#607984;background:#f5fafb;border-radius:7px;padding:6px 7px;margin-top:7px}.actions{display:flex;justify-content:flex-end;gap:6px;margin-top:8px}.actions button{border:1px solid #d6e7eb;border-radius:8px;background:#fff;padding:6px 10px;font-family:inherit;font-size:10px;color:#54727f}.drop{color:#a15b5b!important}.empty{text-align:center;padding:20px;color:#8ca0aa;font-size:12px}.note{font-size:9px;color:#8aa0aa;margin:6px 3px 0}@media(max-width:360px){.row{grid-template-columns:1fr}.modeSwitch button{padding:5px 6px}.listHead{align-items:center}}
input[type="month"]{display:block;width:100%;max-width:100%;min-width:0;-webkit-appearance:none;appearance:none;padding-left:8px;padding-right:2px;overflow:hidden}.row>*{min-width:0;max-width:100%}.field{width:100%;max-width:100%;overflow:hidden}.modal{display:none;position:fixed;inset:0;background:rgba(18,48,62,.36);z-index:50;padding:18px;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-width:650px;border-radius:20px 20px 12px 12px;padding:16px;max-height:90vh;overflow:auto;box-shadow:0 -8px 30px rgba(20,60,80,.18)}.sheetTitle{font-size:16px;font-weight:900;color:#24576b;margin-bottom:12px}.modalBtns{display:grid;grid-template-columns:1fr 2fr;gap:7px}.cancel{border:1px solid #d5e5ea;background:#fff;border-radius:10px;font-family:inherit}.save{width:100%;border:0;border-radius:10px;padding:11px;background:linear-gradient(135deg,#20a6c1,#3985e6);color:#fff;font-family:inherit;font-size:14px;font-weight:800}</style></head><body>
<header class="apphead"><div class="headrow"><div class="logo">SM</div><div><h1>Sales Management</h1><div class="sub">Opportunity & Target Dashboard</div></div></div></header><main>
<div class="section">今月の目標</div><div class="goals">
<div class="goal"><div class="goalTop"><span class="label">損保</span><span class="rate" id="sr">0%</span></div><div class="goalMetric"><div id="sd" class="donut"></div><div class="metricText"><div class="remain">残り <b id="sx">1,000千円</b></div><div class="target">目標 <input id="sg" class="goalInput" type="number" value="1000"> 千円</div></div></div><div class="bar"><div id="sb" class="fill" style="width:0"></div></div></div>
<div class="goal"><div class="goalTop"><span class="label">生保</span><span class="rate" id="lr">0%</span></div><div class="goalMetric"><div id="ld" class="donut"></div><div class="metricText"><div class="remain">残り <b id="lx">500千円</b></div><div class="target">目標 <input id="lg" class="goalInput" type="number" value="500"> 千円</div></div></div><div class="bar"><div id="lb" class="fill" style="width:0"></div></div></div>
<div class="goal action"><div class="goalTop"><span class="label">行動量</span><span class="rate" id="ar">0%</span></div><div class="goalMetric"><div id="ad" class="donut"></div><div class="metricText"><div class="remain">残り <b id="ax">50件</b></div><div class="target">目標 <input id="ag" class="goalInput" type="number" value="50"> 件</div></div></div><div class="bar"><div id="ab" class="fill" style="width:0"></div></div></div><div class="goal outreach"><div><div class="goalTop"><span class="label">発信量</span></div><div class="outreachMain"><svg class="outreachIcon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21.8 2.2a1 1 0 0 0-1.05-.23L2.6 9.05a1 1 0 0 0 .08 1.89l7.08 2.36 2.36 7.08a1 1 0 0 0 .9.68h.05a1 1 0 0 0 .91-.58L22.03 3.25a1 1 0 0 0-.23-1.05ZM12.9 17.2l-1.46-4.38 5.31-5.31-6.62 4.13-4.39-1.46 12.95-5.05L12.9 17.2Z"/></svg><span class="outreachDone" id="outreachStatus">未完了</span></div><div class="outreachCheck"><input id="outreachDone" type="checkbox"><label for="outreachDone">今週の発信を完了</label></div></div><div class="target">毎週月曜日にリセット</div></div></div>
<div class="note">※ 損保・生保は当月の見込案件、行動量は当月の追加件数で集計し、毎月1日にリセットします。成約案件も実績として残ります。発信量は毎週月曜日にリセットします。</div>
<div class="section">案件を追加</div><div class="panel">
<div class="field"><label>会社名</label><input id="company" placeholder="会社名"></div><div class="row"><div class="field"><label>種目</label><select id="kind"><option value="">未選択</option><option>損保</option><option>生保</option><option>ソリューション</option></select></div><div class="field"><label>見込月</label><input id="month" type="month"></div></div><div class="row"><div class="field"><label>保険料（千円）</label><input id="premium" type="number" placeholder="0"></div><div class="field"><label>代理店</label><select id="agency"><option value="">未選択</option><option>法人</option><option>連携</option></select></div></div><div class="field"><label>確度</label><div class="certainty"><input id="ca" name="cert" type="radio" value="A" checked><label for="ca">A</label><input id="cb" name="cert" type="radio" value="B"><label for="cb">B</label><input id="cc" name="cert" type="radio" value="C"><label for="cc">C</label></div></div><div class="field"><label>メモ</label><textarea id="memo" placeholder="必要なことだけメモ"></textarea></div><button id="add" class="primary">追加する</button></div>
<div class="listHead"><div class="listTitleWrap"><div class="section">案件一覧</div><div class="modeSwitch"><button id="modeExpected" type="button" class="active">見込</button><button id="modeAdded" type="button">追加</button></div></div><div class="count" id="count">0件</div></div>
<div class="filter"><button id="prev" aria-label="前月">‹</button><input id="filterMonth" type="month"><div id="monthLabel" class="monthLabel"></div><button id="next" aria-label="翌月">›</button></div>
<div id="list" class="list" style="margin-top:8px"><div class="empty">この月の案件はありません</div></div><div style="text-align:center;font-size:8px;color:#a7bac2;margin-top:12px">v16</div></main>
<div id="modal" class="modal"><div class="sheet"><div class="sheetTitle">案件を編集</div>
<div class="field"><label>会社名</label><input id="eCompany"></div>
<div class="row"><div class="field"><label>種目</label><select id="eKind"><option value="">未選択</option><option>損保</option><option>生保</option><option>ソリューション</option></select></div><div class="field"><label>見込月</label><input id="eMonth" type="month"></div></div>
<div class="row"><div class="field"><label>保険料（千円）</label><input id="ePremium" type="number"></div><div class="field"><label>代理店</label><select id="eAgency"><option value="">未選択</option><option>法人</option><option>連携</option></select></div></div>
<div class="field"><label>確度</label><div class="certainty edit"><input id="ea" name="ecert" type="radio" value="A"><label for="ea">A</label><input id="eb" name="ecert" type="radio" value="B"><label for="eb">B</label><input id="ec" name="ecert" type="radio" value="C"><label for="ec">C</label><input id="ew" name="ecert" type="radio" value="成約"><label for="ew">成約</label></div></div>
<div class="field"><label>メモ</label><textarea id="eMemo"></textarea></div>
<div class="modalBtns"><button id="cancel" type="button" class="cancel">キャンセル</button><button id="save" type="button" class="save">保存する</button></div></div></div>
<script>
"use strict";
var KEY="sales_management_v10",D=[],editIndex=-1,filterMode="expected";
function q(i){return document.getElementById(i)}
function p(n){return n<10?"0"+n:n}
function cm(){var d=new Date();return d.getFullYear()+"-"+p(d.getMonth()+1)}
function dt(){var d=new Date();return d.getFullYear()+"/"+p(d.getMonth()+1)+"/"+p(d.getDate())}
function addedMonth(c){return String(c.date||"").slice(0,7).replace("/","-")}
function weekKey(){var d=new Date(),day=d.getDay(),diff=(day===0?-6:1-day);d.setHours(0,0,0,0);d.setDate(d.getDate()+diff);return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())}
function loadOutreach(){var k=weekKey(),saved={};try{saved=JSON.parse(localStorage.getItem("sales_management_outreach")||"{}")||{}}catch(e){}var done=saved.week===k&&saved.done===true;q("outreachDone").checked=done;q("outreachStatus").textContent=done?"完了":"未完了"}
function saveOutreach(){var done=q("outreachDone").checked;try{localStorage.setItem("sales_management_outreach",JSON.stringify({week:weekKey(),done:done}))}catch(e){}q("outreachStatus").textContent=done?"完了":"未完了"}
function f(n){return Number(n||0).toLocaleString("ja-JP")}
function esc(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;")}
function saveData(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
function radio(name){var r=document.getElementsByName(name);for(var i=0;i<r.length;i++)if(r[i].checked)return r[i].value;return "A"}
function setRadio(name,v){var r=document.getElementsByName(name);for(var i=0;i<r.length;i++)r[i].checked=r[i].value===v}
try{D=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){D=[]}
q("filterMonth").value=cm();q("month").value=cm();
function goal(r,x,b,d,v,g,u){var z=g?Math.round(v/g*100):0;q(r).textContent=z+"%";q(x).textContent=(v>=g&&g>0)?"達成！":f(Math.max(0,g-v))+u;q(b).style.width=Math.min(100,z)+"%";q(d).style.setProperty("--pct",Math.min(100,Math.max(0,z)))}
function render(){
 var current=cm(),view=q("filterMonth").value,s=0,l=0,a=0,h="",n=0;
 D.forEach(function(c,i){
  if(addedMonth(c)===current)a++;
  if(c.month===current){if(c.kind==="損保")s+=+c.premium||0;if(c.kind==="生保")l+=+c.premium||0}
  if((filterMode==="expected"?c.month:addedMonth(c))===view){
   n++;var w=c.cert==="成約";
   h+='<div class="case '+(w?'won':(c.cert||"A").toLowerCase())+'"><div class="top"><div class="name">'+esc(c.company||"会社名未入力")+'</div><span class="badge">'+(w?'成約':'確度 '+esc(c.cert||"A"))+'</span></div><div class="mainMeta"><span class="kind">'+esc(c.kind||"未選択")+'</span><span class="premium">'+f(c.premium)+'千円</span></div><div class="subMeta"><span>代理店 '+esc(c.agency||"未選択")+' ／ 見込 '+esc(c.month||"未設定")+'</span><span>追加 '+esc(c.date||"")+'</span></div>'+(c.memo?'<div class="memo">'+esc(c.memo)+'</div>':'')+'<div class="actions"><button type="button" class="editBtn" data-index="'+i+'">編集</button><button type="button" class="drop dropBtn" data-index="'+i+'">ドロップ</button></div></div>';
  }
 });
 goal("sr","sx","sb","sd",s,+q("sg").value||0,"千円");goal("lr","lx","lb","ld",l,+q("lg").value||0,"千円");goal("ar","ax","ab","ad",a,+q("ag").value||0,"件");q("monthLabel").textContent=view.replace("-","年")+"月";q("count").textContent=n+"件";q("list").innerHTML=h||'<div class="empty">この月の案件はありません</div>';
}
q("add").onclick=function(){D.unshift({company:q("company").value,kind:q("kind").value,premium:+q("premium").value||0,agency:q("agency").value,month:q("month").value,cert:radio("cert"),memo:q("memo").value,date:dt()});saveData();q("company").value="";q("kind").value="";q("premium").value="";q("agency").value="";q("memo").value="";q("ca").checked=true;render()};
function editCase(i){editIndex=i;var c=D[i];if(!c)return;q("eCompany").value=c.company||"";q("eKind").value=c.kind||"";q("ePremium").value=c.premium||"";q("eAgency").value=c.agency||"";q("eMonth").value=c.month||cm();q("eMemo").value=c.memo||"";setRadio("ecert",c.cert||"A");q("modal").classList.add("show")}
function dropCase(i){if(!D[i])return;if(confirm("この案件をドロップ（削除）しますか？")){D.splice(i,1);saveData();render()}}
q("list").addEventListener("click",function(e){var b=e.target.closest("button[data-index]");if(!b)return;var i=parseInt(b.getAttribute("data-index"),10);if(b.classList.contains("editBtn"))editCase(i);else if(b.classList.contains("dropBtn"))dropCase(i)});
q("save").onclick=function(){if(editIndex<0)return;var c=D[editIndex];c.company=q("eCompany").value;c.kind=q("eKind").value;c.premium=+q("ePremium").value||0;c.agency=q("eAgency").value;c.month=q("eMonth").value;c.memo=q("eMemo").value;c.cert=radio("ecert");saveData();q("modal").classList.remove("show");editIndex=-1;render()};
q("cancel").onclick=function(){q("modal").classList.remove("show");editIndex=-1};
q("modal").onclick=function(e){if(e.target===q("modal")){q("modal").classList.remove("show");editIndex=-1}};
q("filterMonth").onchange=render;q("sg").oninput=render;q("lg").oninput=render;q("ag").oninput=render;q("outreachDone").onchange=saveOutreach;
q("modeExpected").onclick=function(){filterMode="expected";q("modeExpected").classList.add("active");q("modeAdded").classList.remove("active");render()};
q("modeAdded").onclick=function(){filterMode="added";q("modeAdded").classList.add("active");q("modeExpected").classList.remove("active");render()};
function mv(k){var v=q("filterMonth").value||cm(),a=v.split("-"),d=new Date(+a[0],+a[1]-1+k,1);q("filterMonth").value=d.getFullYear()+"-"+p(d.getMonth()+1);render()}
q("prev").onclick=function(){mv(-1)};q("next").onclick=function(){mv(1)};loadOutreach();render();
</script></body></html>
